version: '3.8'

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: ${MSSQL_PASSWORD:-Movilidad_2026!}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "${MSSQL_PASSWORD:-Movilidad_2026!}", "-Q", "SELECT 1", "-C"]
      interval: 10s
      retries: 10
      start_period: 30s

  backend:
    build: .
    ports:
      - "${PORT:-3001}:3001"
    environment:
      PORT: 3001
      MSSQL_HOST: mssql
      MSSQL_PORT: 1433
      MSSQL_USER: sa
      MSSQL_PASSWORD: ${MSSQL_PASSWORD:-Movilidad_2026!}
      MSSQL_DATABASE: ${MSSQL_DATABASE:-HumanMobility}
      MSSQL_OPTIONS_ENCRYPT: "false"
      MSSQL_OPTIONS_TRUST_SERVER_CERTIFICATE: "true"
      JWT_SECRET: ${JWT_SECRET:-cambiar-en-produccion}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    depends_on:
      mssql:
        condition: service_healthy
    env_file:
      - path: .env
        required: false

volumes:
  mssql_data:
